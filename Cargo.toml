[workspace]
resolver = "2"
members = ["crates/core", "crates/ai", "crates/app"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
